version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psb-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    networks:
      - psb-network
    depends_on:
      - db
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: db_psb_online
      DB_USERNAME: psb_user
      DB_PASSWORD: secret

  nginx:
    image: nginx:alpine
    container_name: psb-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - psb-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: psb-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: db_psb_online
      MYSQL_USER: psb_user
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - psb-db-data:/var/lib/mysql
    networks:
      - psb-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  psb-db-data:

networks:
  psb-network:
    driver: bridge